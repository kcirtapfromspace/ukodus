name: Tests & Coverage

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core-soundness:
    name: Vendored engine soundness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/sudoku-core
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: Run the complete optimized deterministic engine suite
        run: cargo nextest run --manifest-path vendor/sudoku-core/Cargo.toml --cargo-profile coverage --locked --no-fail-fast
      - name: Run engine doctests (nextest skips them)
        run: cargo test --doc --manifest-path vendor/sudoku-core/Cargo.toml --profile coverage --locked
      - name: Test reproducible source snapshot refresh
        run: python3 -m unittest discover -s scripts -p test_vendor_sudoku_core.py

  rust-coverage:
    name: Rust tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install coverage tool
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Run Rust tests and enforce production coverage
        run: ./scripts/test-coverage.sh --rust-only
      - name: Upload Rust reports and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: target/coverage/
          if-no-files-found: warn

  frontend-coverage:
    name: Frontend checks and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/sudoku-wasm
      - name: Test the browser proof JSON boundaries
        run: cargo test --manifest-path ../vendor/sudoku-wasm/Cargo.toml --locked
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      - name: Rebuild the browser engine before testing its shipped assets
        run: ../scripts/build-wasm.sh
      - run: npm ci
      - name: Install Chromium and browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Check Svelte and TypeScript
        id: types
        continue-on-error: true
        run: npm run check
      - name: Run frontend tests and coverage gates
        id: coverage
        continue-on-error: true
        run: npm run test:coverage
      - name: Build frontend
        id: build
        continue-on-error: true
        run: npm run build
      - name: Smoke-test gameplay with the real WASM engine
        id: smoke
        continue-on-error: true
        run: npm run test:smoke
      - name: Require every frontend check to pass
        if: steps.types.outcome != 'success' || steps.coverage.outcome != 'success' || steps.build.outcome != 'success' || steps.smoke.outcome != 'success'
        run: exit 1
      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: warn
